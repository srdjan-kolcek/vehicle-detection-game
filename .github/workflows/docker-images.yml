name: Docker images

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

# Read-only by default; the job below adds packages: write.
permissions:
  contents: read

concurrency:
  group: docker-images-${{ github.ref }}
  # Never cancel a publish run on main or a tag; only superseded PR builds.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Write access only where we publish; pull requests get read.
      packages: ${{ github.event_name == 'push' && 'write' || 'read' }}
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend, pipeline]
    env:
      # Only pushes to main and version tags publish. Pull requests only build.
      PUBLISH: ${{ github.event_name == 'push' }}
    steps:
      - name: Check out
        uses: actions/checkout@v4.2.2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3.7.1

      - name: Log in to ghcr.io
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registry names must be lowercase.
      - name: Compute image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.image }}" >> "$GITHUB_ENV"

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5.6.1
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6.10.0
        with:
          context: ./${{ matrix.image }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
